<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A08">
<title>Söz — Sayfa Bulunamadı</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A08;--surface:#1A1612;
  --text:#E8E0D0;--text2:rgba(232,224,208,0.55);--text3:rgba(232,224,208,0.3);
  --accent:#C4956A;--accent3:rgba(196,149,80,0.07);--border:rgba(196,149,80,0.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.glow{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(196,149,80,0.06) 0%,transparent 65%);pointer-events:none}
.wrap{max-width:520px;margin:0 auto;padding:24px;text-align:center;position:relative}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg,#131210,#1c1814);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;box-shadow:0 0 60px rgba(196,149,80,0.08)}
.code{font-size:11px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:20px}
h1{font-size:clamp(30px,5vw,42px);font-weight:300;margin-bottom:20px;letter-spacing:-.01em;line-height:1.3}
p{font-size:17px;color:var(--text2);line-height:1.85;font-style:italic;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:var(--accent);color:#0A0A08;border-radius:10px;font-size:14px;font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.04em;text-decoration:none;transition:all .25s}
.btn:hover{background:#d4a57a;transform:translateY(-2px)}
.quote{font-size:14px;font-style:italic;color:var(--text3);letter-spacing:.05em;margin-top:48px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 40 40" fill="none"><line x1="13" y1="11" x2="27" y2="11" stroke="#C4956A" stroke-width="2" stroke-linecap="round"/><path d="M27 11C27 11 13 11 13 20C13 29 27 29 27 29" stroke="#C4956A" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="13" y1="29" x2="27" y2="29" stroke="#C4956A" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="2" fill="#C4956A"/></svg>
  </div>
  <span class="code">404</span>
  <h1>Bu sayfa kayıp bir ayet gibi<br>bulunamadı.</h1>
  <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ama merak etme, doğru yol seni ana sayfada bekliyor.</p>
  <a href="/" class="btn">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>
    Ana Sayfaya Dön
  </a>
  <div class="quote">"Sözün ayağıma kandil, yoluma ışıktır." — Mezmur 119:105</div>
</div>
</body>
</html>
